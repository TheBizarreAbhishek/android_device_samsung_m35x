name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/samsung/m35x'
      DEVICE_NAME:
        description: 'Device Name (codename)'
        required: true
        default: 'm35x'

jobs:
  build:
    name: Build Recovery by ${{ github.actor }}
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}/device/samsung/m35x

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 python3-pip

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize & Sync OrangeFox Sources
        run: |
          mkdir -p ${{ github.workspace }}/fox
          cd ${{ github.workspace }}/fox
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree to Source
        run: |
          mkdir -p ${{ github.workspace }}/fox/${{ github.event.inputs.DEVICE_PATH }}
          cp -r ${{ github.workspace }}/device/samsung/m35x/* ${{ github.workspace }}/fox/${{ github.event.inputs.DEVICE_PATH }}/

      - name: Build OrangeFox
        run: |
          cd ${{ github.workspace }}/fox
          source build/envsetup.sh
          lunch fox_${{ github.event.inputs.DEVICE_NAME }}-eng
          make recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            ${{ github.workspace }}/fox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ github.workspace }}/fox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
            ${{ github.workspace }}/fox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.tar
