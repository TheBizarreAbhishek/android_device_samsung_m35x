name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - name: Cleanup workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare build environment
      run: |
        sudo apt update
        sudo apt install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev sdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3 tar libstatgrab-dev zip unzip curl

    - name: Install repo command
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Workspace
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "Actions Build"
        git config --global user.email "build@github.actions"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

    - name: Sync TWRP Sources
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync
        
    - name: Clone Device Tree
      run: |
        cd workspace
        git clone https://github.com/${{ github.repository }}.git -b ${{ github.ref_name }} device/samsung/m35x
        
    - name: Check out prebuilt kernel 
      run: |
        # Download prebuilt kernel and dtb from existing device tree structures or we can reuse existing if committed. 
        # Since it's in the repo, device tree is sufficient.
        echo "Device tree cloned successfully"

    - name: Build Recovery Image
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_m35x-eng
        make clean
        make recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-m35x
        path: |
          workspace/out/target/product/m35x/recovery.img
          workspace/out/target/product/m35x/*.zip
          workspace/out/target/product/m35x/recovery.tar

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/m35x/recovery.img
          workspace/out/target/product/m35x/recovery.tar
        name: TWRP M35x Build - ${{ github.run_id }}
        tag_name: twrp-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
